services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_bin
    environment:
      MYSQL_DATABASE: zabbix
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: ChangeMeZabbix
      MYSQL_ROOT_PASSWORD: ChangeMeRoot
    volumes: [zabbix_db:/var/lib/mysql]
  server:
    image: zabbix/zabbix-server-mysql:alpine-7.0-latest
    restart: unless-stopped
    depends_on: [mysql]
    environment:
      DB_SERVER_HOST: mysql
      MYSQL_DATABASE: zabbix
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: ChangeMeZabbix
    ports: ["10051:10051"]
  web:
    image: zabbix/zabbix-web-nginx-mysql:alpine-7.0-latest
    restart: unless-stopped
    depends_on: [server, mysql]
    environment:
      DB_SERVER_HOST: mysql
      MYSQL_DATABASE: zabbix
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: ChangeMeZabbix
      ZBX_SERVER_HOST: server
      PHP_TZ: Europe/Paris
    ports: ["8081:8080"]
volumes:
  zabbix_db:
