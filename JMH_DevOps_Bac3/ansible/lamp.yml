---
- name: Serveur LAMP JMH
  hosts: lamp
  become: true
  tasks:
    - name: Installer LAMP
      ansible.builtin.apt:
        name: [apache2, mariadb-server, php, php-mysql, libapache2-mod-php, php-cli, php-curl, php-xml, php-mbstring, unzip]
        state: present
        update_cache: true
    - name: Activer Apache
      ansible.builtin.service: {name: apache2, state: started, enabled: true}
    - name: Activer MariaDB
      ansible.builtin.service: {name: mariadb, state: started, enabled: true}
    - name: Page de test
      ansible.builtin.copy:
        dest: /var/www/html/index.php
        mode: '0644'
        content: '<?php echo "JMH LAMP OK"; phpinfo(); ?>'
